name: Bug report
description: Report a reproducible client or protocol problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: client_version
    attributes:
      label: Client version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: prime_version
    attributes:
      label: Prime Agent version
      description: Output of `prime-agent --version`
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Include a minimal reproduction and sanitized stderr if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and installation method.
    validations:
      required: true

