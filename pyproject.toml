[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-agent-python-client"
version = "0.2.0"
description = "Unofficial async Python RPC client for Prime Agent"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Superagentic AI", email = "info@super-agentic.ai"},
]
keywords = ["prime-agent", "rpc", "agent", "coding-agent", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SuperagenticAI/prime-agent-python-client"
Documentation = "https://github.com/SuperagenticAI/prime-agent-python-client/tree/main/docs"
Repository = "https://github.com/SuperagenticAI/prime-agent-python-client"
Issues = "https://github.com/SuperagenticAI/prime-agent-python-client/issues"
Changelog = "https://github.com/SuperagenticAI/prime-agent-python-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prime_agent_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["prime_agent_client"]
